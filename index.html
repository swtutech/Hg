  .purchase-result-icon{width:88px;height:88px;border-radius:999px;margin:0 auto 22px;display:flex;align-items:center;justify-content:center}

  .tab-active{ color:#34d399; }
  .tab-active svg{ stroke:#34d399 }
  .tab-active .tab-dot{ opacity:1; transform:scale(1); }

  .gradient-text{ background:linear-gradient(92deg,#6ee7b7,#34d399,#22d3ee); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .btn-primary{ background:linear-gradient(180deg,#10b981,#059669); box-shadow:0 10px 26px -10px rgba(16,185,129,.6), inset 0 1px 0 rgba(255,255,255,.25); }
  .btn-primary:active{ transform:translateY(1px); }
  .field{ width:100%; background:rgba(7,11,20,.7); border:1px solid rgba(255,255,255,.09); border-radius:.85rem; padding:.85rem 1rem; font-size:.875rem; transition:.2s; }
  .field:focus{ border-color:#10b981; box-shadow:0 0 0 3px rgba(16,185,129,.18); background:rgba(7,11,20,.9); }
  .shimmer{ background:linear-gradient(100deg,rgba(255,255,255,.04) 30%,rgba(255,255,255,.10) 50%,rgba(255,255,255,.04) 70%); background-size:200% 100%; animation:sh 1.4s infinite; }

  .pressable{ transition:transform .15s ease, box-shadow .2s ease; }
  .pressable:active{ transform:scale(.97); }

  .aspect-video-box>iframe,.aspect-video-box>video{ position:absolute; inset:0; width:100%; height:100%; border:0; }

  .announcement-marquee-track{display:inline-block;min-width:100%;padding-left:100%;animation:announcementScroll 18s linear infinite;}

  /* ============ NEW: PROFESSIONAL SPLASH / LOADING SCREEN ============ */
  #splash{
    position:fixed; inset:0; z-index:9999;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:
      radial-gradient(70% 55% at 50% 20%, rgba(16,185,129,.22), transparent 60%),
      radial-gradient(50% 40% at 90% 100%, rgba(59,130,246,.12), transparent 60%),
      #05070d;
    transition:opacity .6s ease, visibility .6s ease;
  }
  #splash.hide{ opacity:0; visibility:hidden; pointer-events:none; }
  .splash-logo{
    width:88px; height:88px; border-radius:26px;
    background:linear-gradient(135deg,#6ee7b7,#10b981 45%,#047857);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 1px rgba(16,185,129,.2), 0 24px 60px -14px rgba(16,185,129,.55);
    animation:logoPop .8s cubic-bezier(.22,1,.36,1) both, logoFloat 3s ease-in-out 0.8s infinite;
    position:relative;
  }
  .splash-logo::after{
    content:''; position:absolute; inset:-14px; border-radius:34px;
    border:2px solid rgba(16,185,129,.25);
    animation:ringPulse 2.2s ease-out infinite;
  }
  @keyframes logoPop{ from{opacity:0; transform:scale(.6) translateY(10px)} to{opacity:1; transform:scale(1) translateY(0)} }
  @keyframes logoFloat{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  @keyframes ringPulse{ 0%{transform:scale(.9); opacity:.7} 100%{transform:scale(1.4); opacity:0} }
  .splash-title{
    font-family:'Sora',sans-serif; font-weight:800; letter-spacing:-.02em;
    font-size:1.9rem; margin-top:22px;
    background:linear-gradient(92deg,#6ee7b7,#34d399,#22d3ee);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:fade .7s .25s both;
  }
  .splash-sub{
    color:#64748b; font-size:.8rem; margin-top:6px; font-weight:600; letter-spacing:.02em;
    animation:fade .7s .4s both;
  }
  .splash-bar{
    width:180px; height:4px; border-radius:99px; margin-top:26px; overflow:hidden;
    background:rgba(255,255,255,.08); animation:fade .7s .5s both;

  .splash-bar>span{
    display:block; height:100%; width:40%; border-radius:99px;

    animation:loadSlide 1.1s cubic-bezier(.65,0,.35,1) infinite;
  }
  @keyframes loadSlide{ 0%{transform:translateX(-120%)} 100%{transform:translateX(320%)} }
  .splash-dots{ display:flex; gap:6px; margin-top:20px; animation:fade .7s .6s both; }

  .receipt-total-label{font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
  .receipt-total-value{font-family:'Sora',sans-serif;font-size:22px;font-weight:800;color:#0f172a}
  .receipt-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px 14px;padding-top:12px}
  .receipt-field-label{font-size:9px;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
  .receipt-field-value{font-size:11px;color:#1e293b;font-weight:700;line-height:1.35;word-break:break-word;margin-top:2px}
  .receipt-ref{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9px}
  .receipt-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .receipt-action{height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:12px;font-weight:800;transition:.15s}
  .receipt-action:active{transform:scale(.97)}
  .receipt-action-primary{background:linear-gradient(180deg,#10b981,#059669);color:#fff}
  .receipt-action-secondary{background:rgba(255,255,255,.07);color:#e2e8f0;border:1px solid rgba(255,255,255,.09)}
  .receipt-close{width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.08);color:#fff;display:flex;align-items:center;justify-content:center}
  .receipt-note{text-align:center;font-size:9px;color:#94a3b8;padding:10px 6px 2px}

  .splash-dots i{ width:7px; height:7px; border-radius:99px; background:#10b981; display:block; animation:dotBounce 1.2s infinite; }
  .splash-dots i:nth-child(2){ animation-delay:.15s } .splash-dots i:nth-child(3){ animation-delay:.3s }
  @keyframes dotBounce{ 0%,80%,100%{transform:scale(.6); opacity:.4} 40%{transform:scale(1); opacity:1} }

<script>
/* =====================================================================
   PWA: dynamic manifest + service worker registration + install prompt
   ===================================================================== */
(function setupPWA(){
  // Use the same embedded manifest/install lifecycle as the working reference.
  // The previous blob-based service-worker registration is not supported by
  // browsers and prevented reliable PWA installability.
  window.deferredInstallPrompt = null;
  window.appInstalled = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  window.installCardDismissed = (()=>{try{return sessionStorage.getItem('siwtu-pwa-prompt-dismissed')==='1'}catch(_){return false}})();
  window.addEventListener('beforeinstallprompt', (event) => {
    event.preventDefault();
    window.deferredInstallPrompt = event;
    try { if (window.State && State.route === 'profile' && typeof renderProfile === 'function') { renderProfile(); renderTabbar(); } } catch(_){}
    try { const b=document.getElementById('siwtuGlobalInstallBtn'); if(b) b.textContent='Install'; } catch(_){}
  });
  window.addEventListener('appinstalled', () => {
    window.appInstalled = true; window.deferredInstallPrompt = null;
    window.installCardDismissed = true;
    try { sessionStorage.setItem('siwtu-pwa-prompt-dismissed','1'); } catch(_){}
    try { const c=document.getElementById('siwtuGlobalInstallCard'); if(c)c.style.display='none'; } catch(_){}
    try { if (window.State && State.route === 'profile' && typeof renderProfile === 'function') { renderProfile(); renderTabbar(); } } catch(_){}
    try { toast('SIWTU has been installed on your device.','ok'); } catch(_){}
  });
})();

/* =====================================================================
   SPLASH / LOADING SCREEN CONTROL
   ===================================================================== */
function hideSplash(){
  const s = document.getElementById('splash');
  if (!s) return;
  // ensure the splash shows for a minimum professional duration
  s.classList.add('hide');
  setTimeout(()=>{ try{ s.remove(); }catch(_){} }, 650);
}

/* =====================================================================
   PERFORMANCE CACHE
   - Transactions stay cached until the wallet/transaction state changes.
   - Data plans are cached per category so returning to the Data page is
     instant. The backend also caches provider plans, reducing API load.
   ===================================================================== */
const TX_CACHE_PREFIX = 'siwtu_tx_cache_v3_';
const DATA_CACHE_PREFIX = 'siwtu_data_cache_v2_';
/* Only actions that actually create a Transactions-sheet entry refresh the
   transaction snapshot. Navigation, login/logout, polling and unrelated
   actions NEVER invalidate this cache. */
const TRANSACTION_ACTIONS = new Set([
  'buyAirtime','buyData','buyCable','buyElectricity','buyEpin','buyExamPin','buyEsim','printVoucher',
  'cashStep1','cashStep2','cashStep3','cashWithdraw'
]);
/* All actions that create a Transactions-sheet row must refresh history.
   fundVerify is intentionally NOT in TRANSACTION_ACTIONS, so wallet funding
   never triggers the transaction PIN/password guard. */
const TX_REFRESH_ACTIONS = new Set([...TRANSACTION_ACTIONS, 'fundVerify']);
function txCacheKey(){ return TX_CACHE_PREFIX + String(State.user?.email || '').toLowerCase(); }
function readTxCache(){ try { const x=localStorage.getItem(txCacheKey()); return x?JSON.parse(x):null; } catch(_){ return null; } }
function writeTxCache(list){ try { localStorage.setItem(txCacheKey(), JSON.stringify({at:Date.now(),transactions:list||[]})); } catch(_){} }
function clearTxCache(){ try { if(State.user?.email) localStorage.removeItem(txCacheKey()); } catch(_){} }
async function refreshTxCache(){
  if(!State.token || !State.user?.email) return false;
  try {
    /* The cache is display-only. Every refresh below reads the current backend
       transaction list, so an old localStorage snapshot cannot stay forever. */
    const r = await api('transactions', { __skipTxRefresh: true });
    if(r && r.ok && Array.isArray(r.transactions)){
      writeTxCache(r.transactions);
      if(State.route==='transactions'){
        const box=$('#txList');
        if(box) box.innerHTML = r.transactions.length ? r.transactions.map(txRow).join('') : `<div class="card rounded-2xl py-12 text-center text-slate-500 text-sm">No transactions yet</div>`;
      } else if(State.route==='dashboard'){

      }
      return true;
    }
  } catch(_){}
  return false;
}

async function api(action, data={}) {
  if (TRANSACTION_ACTIONS.has(action) && !data.__skipPinGuard && !data.transactionPin) {
    const pin = await getTransactionPin();
    if (!pin) return { ok:false, error:'Transaction authorization cancelled.' };
    data = Object.assign({}, data, { transactionPin: pin });
  }
  const purchaseFlow = isPurchaseAction(action);
  if(purchaseFlow) showPurchaseProcessing(action === 'buyData' ? 'Data purchase' : 'Airtime purchase');
  const body = JSON.stringify(Object.assign({ action, token: State.token }, data));
  try {
    const res = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body });
    const j = await res.json();
    if (j && j.authError) { logout(true); }
    if (purchaseFlow && j && !j.ok) {
      j.error = 'The service is temporarily unavailable right now. Please try again later';
      delete j.provider; delete j.provider_response; delete j.provider_error; delete j.api; delete j.endpoint; delete j.balance;
    }
    if(purchaseFlow) hidePurchaseProcessing();
    if (j && j.ok && TX_REFRESH_ACTIONS.has(action) && !data.__skipTxRefresh) {
      if(purchaseFlow) refreshTxCache().catch(()=>{}); else await refreshTxCache();
    }
    return j;
  } catch (e) {
    if(purchaseFlow) hidePurchaseProcessing();
    return { ok:false, error: purchaseFlow ? 'The service is temporarily unavailable right now. Please try again later' : 'Unable to complete your request right now. Please try again later.' };
  }
}

/* =====================================================================
   VIDEOS + LIVE TV — FRONTEND ENGINE (rides on eSIM/buyEsim backend)
   =====================================================================
   HOW IT WORKS (no backend/sheet changes):
   - Videos are stored as Prices rows with service='esim'. We pack the
     video's metadata (title, url, poster, category, desc) INSIDE the
     'label' field using a JSON payload prefixed with "VID::".
     -> code   = unique video id (used as buyEsim category)
     -> amount = price per view
   - Purchases call action 'buyEsim' with {category: code}. That debits
     the wallet + logs a transaction (backend logs it 'pending', but we
     treat/display it as SUCCESS because the wallet was deducted).
   - Live TV channels + subscription plans are admin-managed and stored
     in localStorage. Subscription charges also go through 'buyEsim'
     using dedicated hidden price rows (service='esim', TV:: payload).
   ===================================================================== */

const VID_PREFIX = 'VID::';
const TV_PREFIX  = 'TVPLAN::';

/* ---------- NEW: server-synced settings prefixes ---------- */
const TVSET_PREFIX = 'TVSET::';   // hidden esim row holding {adblock, tvpaid}
const TVCH_PREFIX  = 'TVCH::';    // hidden esim row holding one channel

/* Read the single settings row from cfg.extraServices (server-synced) */
function tvSettings_(){
  const rows = (State.cfg && State.cfg.extraServices) || [];
  for (let i=0;i<rows.length;i++){
    const r = rows[i];
    if (String(r.service)!=='esim') continue;
    const label = String(r.label||'');
    if (label.indexOf(TVSET_PREFIX)===0){
      try { const meta = JSON.parse(label.slice(TVSET_PREFIX.length)); meta._id = r.id; return meta; } catch(e){}
    }
  }
  return null;
}
/* Persist settings to server (creates/updates the single TVSET row) */
async function saveTvSettings_(patch){
  const cur = tvSettings_() || { adblock:1, tvpaid:1 };
  const next = Object.assign({}, cur, patch);
  const id = cur._id || '';
  delete next._id;
  const label = TVSET_PREFIX + JSON.stringify(next);
  await api('adminSavePrice',{ price:{ id:id, service:'esim', code:'__tvsettings__', label, network:'', amount:0, active:'yes' } });
  const c = await api('config'); if(c && c.ok) State.cfg = c.config;
}

/* ---------- AD-BLOCK MODE (now server-synced) ---------- */
function adBlockOn_(){ const s = tvSettings_(); return s ? (Number(s.adblock)===1) : true; }
async function setAdBlock_(on){ await saveTvSettings_({ adblock: on?1:0 }); }

/* Parse the label payload from an esim price row. Returns {kind,meta} */
function parseExtra_(row){
  const label = String(row.label||'');
  if (label.indexOf(VID_PREFIX)===0){
    try { return { kind:'video', meta: JSON.parse(label.slice(VID_PREFIX.length)) }; } catch(e){ return null; }
  }
  if (label.indexOf(TV_PREFIX)===0){
    try { return { kind:'tvplan', meta: JSON.parse(label.slice(TV_PREFIX.length)) }; } catch(e){ return null; }
  }
  // Live TV channels & settings ride on esim rows too — mark them so they are
  // hidden from Videos/Prices lists but NOT treated as videos/plans.
  if (label.indexOf(TVCH_PREFIX)===0)  return { kind:'tvchannel', meta:null };
  if (label.indexOf(TVSET_PREFIX)===0) return { kind:'tvsetting', meta:null };
  return null; // legacy esim / other items are ignored by video/tv UI
}

/* Get all videos from cfg.extraServices */
function getVideos_(){
  const rows = (State.cfg && State.cfg.extraServices) || [];
  const out = [];
  rows.forEach(r=>{
    if (String(r.service)!=='esim') return;
    const p = parseExtra_(r);
    if (p && p.kind==='video'){
      out.push(Object.assign({ code:String(r.code), price:Number(r.amount)||0 }, p.meta));
    }
  });
  return out;
}
/* Get TV subscription plans from cfg.extraServices */
function getTvPlans_(){
  const rows = (State.cfg && State.cfg.extraServices) || [];
  const out = [];
  rows.forEach(r=>{
    if (String(r.service)!=='esim') return;
    const p = parseExtra_(r);
    if (p && p.kind==='tvplan'){
      out.push(Object.assign({ code:String(r.code), price:Number(r.amount)||0 }, p.meta));
    }
  });
  // default plans if none configured
  if (!out.length){
    return [
      {code:'tv_daily',   name:'Daily',   period:'day',   price:0, _virtual:true},
      {code:'tv_weekly',  name:'Weekly',  period:'week',  price:0, _virtual:true},
      {code:'tv_monthly', name:'Monthly', period:'month', price:0, _virtual:true},
      {code:'tv_yearly',  name:'Yearly',  period:'year',  price:0, _virtual:true},
    ];
  }
  return out;
}

/* ---- Live TV channels (admin managed, SERVER-SYNCED via esim rows) ---- */
/* Read channels from cfg.extraServices. Each channel is a TVCH:: esim row.
   Falls back to DEFAULT_TV only when no channels have been configured yet. */
function tvChannels_(){
  const rows = (State.cfg && State.cfg.extraServices) || [];
  const out = [];
  rows.forEach(r=>{
    if (String(r.service)!=='esim') return;
    const label = String(r.label||'');
    if (label.indexOf(TVCH_PREFIX)===0){
      try { const meta = JSON.parse(label.slice(TVCH_PREFIX.length)); meta._rowId = r.id; out.push(meta); } catch(e){}
    }
  });
  return out.length ? out : DEFAULT_TV.slice();
}
/* Save a single channel to the server (create or update) */
async function saveTvChannel_(ch){
  const rows = (State.cfg && State.cfg.extraServices) || [];
  let rowId = '';
  rows.forEach(r=>{

/* Build a YouTube watch id from url */
function ytId_(src){
  const s = String(src||'');
  let m = s.match(/[?&]v=([^&]+)/); if (m) return m[1];
  m = s.match(/youtu\.be\/([^?&]+)/); if (m) return m[1];
  m = s.match(/embed\/([^?&]+)/); if (m) return m[1];
  if (/^[A-Za-z0-9_-]{6,}$/.test(s)) return s;
  return '';
}
/* Build a Google Drive preview embed url from any Drive link */
function driveEmbed_(src){
  const s = String(src||'');
  let m = s.match(/\/file\/d\/([^\/]+)/); if (m) return 'https://drive.google.com/file/d/'+m[1]+'/preview';
  m = s.match(/[?&]id=([^&]+)/); if (m) return 'https://drive.google.com/file/d/'+m[1]+'/preview';
  if (s.indexOf('drive.google.com')>-1 && s.indexOf('/preview')>-1) return s;
  return '';
}

/* =====================================================================
   NEW: AD-FREE YOUTUBE EMBED BUILDER (no redirect, in-page only)
   =====================================================================
   - Uses youtube-nocookie.com privacy-enhanced domain to reduce ads/tracking
   - Disables related videos, branding & fullscreen redirect prompts
   - When ad-block mode is ON we also enable no-cookie + strict params
   ===================================================================== */
function ytEmbedUrl_(id, opts){
  opts = opts || {};
  // Always use the standard youtube.com embed host — youtube-nocookie.com
  // triggers Error 150/153 far more often. We still keep it ad-lean via params.
  const host = 'https://www.youtube.com';

  // Only send a valid http/https origin. A "null"/"file://" origin is the
  // #1 cause of "Error 153 / Video player configuration error".
  const org = (location && location.origin && /^https?:/i.test(location.origin))
    ? location.origin : '';

  const params = [
    'autoplay=1',
    'rel=0',
    'modestbranding=1',
    'playsinline=1',
    'iv_load_policy=3',   // hide annotations/overlays
    'fs=1',
    'controls=1',
    'disablekb=0',
    'enablejsapi=1',
    (opts.mute? 'mute=1':'mute=0')
  ];
  if (org){
    params.push('origin=' + encodeURIComponent(org));
    params.push('widget_referrer=' + encodeURIComponent(org));
  }
  return `${host}/embed/${encodeURIComponent(id)}?${params.join('&')}`;
}

async function boot() {
  if (API_URL.includes('PASTE_YOUR')) {
    app.innerHTML = `<div class="p-8 text-center"><h2 class="font-display text-xl font-bold text-amber-400">Setup needed</h2><p class="text-slate-400 text-sm mt-2">Paste your Google Apps Script Web App URL into <code class="text-brand-400">API_URL</code> at the top of index.html.</p></div>`;
    hideSplash();
    return;
  }
  /* Config and session validation are independent, so do them together. */
  const configPromise = api('config');
  const mePromise = State.token ? api('me') : Promise.resolve(null);
  const [c,m] = await Promise.all([configPromise, mePromise]);
  State.cfg = (c && c.ok) ? c.config : { siteName:'SIWTU', services:[] };
  document.title = State.cfg.siteName + ' — Airtime & Data';
  setupWhatsApp();
  if (m && m.ok) { State.user = m.user; navigate('dashboard'); startPolling(); resumePendingTransferFunding(); hideSplash(); return; }
  navigate('landing');
  hideSplash();
}
function setupWhatsApp(){ const wa = $('#waFloat'); if (State.cfg.whatsapp) { wa.href = 'https://wa.me/'+State.cfg.whatsapp; } }

function startPolling(){
  stopPolling();
  State.poll = setInterval(async ()=>{
    if (!State.token) return;
    const m = await api('me');
    if (m && m.ok) {
      const changed = !State.user || State.user.wallet !== m.user.wallet || State.user.cashAvailable !== m.user.cashAvailable;
      State.user = m.user;
      document.querySelectorAll('[data-wallet]').forEach(el=>{ el.textContent = balText(m.user.wallet); });
      if (State.route==='withdrawals') loadWithdrawals();
      if (State.route==='dashboard' && changed) renderDashboard();
    }
    const c = await api('config'); if (c && c.ok) {
      State.cfg = c.config;
      if (State.route==='livetv' && !document.querySelector('#modalRoot .aspect-video-box')) renderLiveTv();
      if (State.route==='videos' && !document.querySelector('#modalRoot .aspect-video-box')) filterVideos();
    }
    const ar = await api('announcements');
    if (ar && ar.ok) {
      const before = JSON.stringify(State.announcements||[]);
      State.announcements = ar.announcements || [];
      if (State.route==='dashboard' && before !== JSON.stringify(State.announcements)) renderDashboard();
    }
  }, 8000);

  /* History gets its own fast poll. This is what makes a newly-created funding
     or service transaction appear without leaving/re-entering the page. */
  State.txPoll = setInterval(async ()=>{
    if (!State.token || !State.user?.email) return;
    await refreshTxCache();
  }, 3000);
}
function stopPolling(){
  if(State.poll){ clearInterval(State.poll); State.poll=null; }
  if(State.txPoll){ clearInterval(State.txPoll); State.txPoll=null; }
}
function logout(silent){
  /* Keep the per-user transaction snapshot. It survives logout/login so the
     next session can display the last known history without fetching it. */
  State.token=null; State.user=null; localStorage.removeItem('vtu_token'); stopPolling(); if(!silent) toast('Logged out','info'); navigate('landing');
}

function announcementHTML(){
  const list=Array.isArray(State.announcements)?State.announcements:[];
  if(!list.length) return '';
  const marquees=list.filter(a=>a.type==='marquee');
  const notices=list.filter(a=>a.type!=='marquee');
  let h='';
  if(marquees.length){
    const text=marquees.map(a=>`<span class="font-semibold">${esc(a.title)}:</span> ${esc(a.message)}`).join(' &nbsp; • &nbsp; ');
    h+=`<div class="announcement-marquee card p-3 text-xs text-brand-100 mb-3" title="Broadcast update"><div class="announcement-marquee-track">${text}</div></div>`;
  }
  if(notices.length){
    h+=`<div class="space-y-2">${notices.map(a=>`<div class="announcement-notice card rounded-2xl p-4"><div class="flex items-start gap-3"><div class="w-9 h-9 rounded-xl bg-brand-500/15 text-brand-300 flex items-center justify-center shrink-0"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.5-2V11a6.5 6.5 0 00-13 0v4L4 17h5m2 0v1a1 1 0 002 0v-1"/></svg></div><div><p class="text-sm font-bold">${esc(a.title)}</p><p class="text-xs text-slate-400 mt-1 leading-relaxed">${esc(a.message)}</p></div></div></div>`).join('')}</div>`;
  }
  return h;
}

/* Present a friendlier service label to customers (eSIM -> the transaction detail's kind) */
function friendlyService_(t){
  const s = String(t.service||'');
  if (s.toLowerCase()==='esim'){
    let d={}; try{ d=JSON.parse(t.detail); }catch(e){}
    if (d && d.kind==='tv') return 'Live TV';
    return 'Video';
  }
  return s;
}
/* Treat esim/video/TV pending as success on the frontend (wallet already deducted) */
function displayStatus_(t){
  let st = String(t.status||'');
  const s = String(t.service||'').toLowerCase();
  if (s==='esim' && (st==='pending' || st==='processing')) return 'success';
  return st;
}
function txRow(t){
  const st = displayStatus_(t);
  const ok = st==='success', fail = st==='failed';
  const credit = t.type==='credit';
  const color = fail?'text-red-400': credit?'text-brand-400':'text-slate-100';
  const badge = ok?'text-brand-400': fail?'text-red-400':'text-amber-400';
  const svc = friendlyService_(t);
  return `<button onclick='showReceipt(${JSON.stringify(t).replace(/'/g,"&#39;")})' class="w-full card rounded-2xl p-3.5 flex items-center gap-3 text-left pressable">
    ${txIcon(svc)}
    <div class="flex-1 min-w-0">
      <p class="text-sm font-semibold truncate">${esc(svc)}</p>
      <p class="text-[11px] text-slate-500">${new Date(t.createdAt).toLocaleString('en-NG',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</p>
    </div>
    <div class="text-right"><p class="text-sm font-bold ${color}">${credit?'+':'-'}${peso(t.amount)}</p><p class="text-[10px] ${badge} capitalize">${esc(st)}</p></div>
  </button>`;
}

/* =====================================================================
   PAYSTACK PAY-WITH-TRANSFER FUNDING
   - No Paystack Checkout/Popup is opened.
   - The backend creates a temporary Paystack transfer account for this
     specific funding transaction.
   - SIWTU displays the bank, account number, account name, amount and
     expiry countdown inside the existing dark SIWTU UI.
   - Payment is verified server-side and the wallet is credited only after
     Paystack reports the transaction as successful.
   ===================================================================== */
const FUNDING_PENDING_KEY = 'siwtu_pending_transfer_funding_v2';
const FUNDING_RETRY_DELAYS = [0, 1500, 3000, 5000, 8000, 12000, 20000, 30000];

function fundingOwnerKey(){ return String(State.user?.email || '').trim().toLowerCase(); }

function readPendingFunding(){
  try {
    const raw = localStorage.getItem(FUNDING_PENDING_KEY);
    if (!raw) return null;
    const x = JSON.parse(raw);
    if (!x || !x.reference || !x.email) return null;
    if (String(x.email).toLowerCase() !== fundingOwnerKey()) return null;
    return x;
  } catch(_) { return null; }
}

function savePendingFunding(data){
  if (!data || !data.reference || !fundingOwnerKey()) return;
  try {
    localStorage.setItem(FUNDING_PENDING_KEY, JSON.stringify({
      reference:String(data.reference),
      email:fundingOwnerKey(),
      amount:Number(data.amount)||0,
      accountNumber:String(data.accountNumber||''),
      bankName:String(data.bankName||''),
      accountName:String(data.accountName||''),
      expiresAt:String(data.expiresAt||''),
      at:Date.now()
    }));
  } catch(_){}
}

function clearPendingFunding(reference){
  try {
    const x=readPendingFunding();
    if(!reference || !x || String(x.reference)===String(reference)) localStorage.removeItem(FUNDING_PENDING_KEY);
  } catch(_){}
}

function formatFundExpiry(iso){
  const ms=Math.max(0,new Date(iso).getTime()-Date.now());
  const total=Math.floor(ms/1000);
  return String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0');
}

function stopFundingWatchers(){
  if(State.pendingFundingTimer){ clearTimeout(State.pendingFundingTimer); State.pendingFundingTimer=null; }
  if(State.fundingCountdownTimer){ clearInterval(State.fundingCountdownTimer); State.fundingCountdownTimer=null; }
  if(State.fundingVerifyTimer){ clearInterval(State.fundingVerifyTimer); State.fundingVerifyTimer=null; }
}

function startFundingCountdown(expiresAt){
  if(State.fundingCountdownTimer) clearInterval(State.fundingCountdownTimer);
  const tick=()=>{
    const el=$('#fundCountdown');
    const btn=$('#fundPaidBtn');
    const left=new Date(expiresAt).getTime()-Date.now();
    if(el) el.textContent=formatFundExpiry(expiresAt);
    if(left<=0){
      clearInterval(State.fundingCountdownTimer); State.fundingCountdownTimer=null;
      if(el) el.textContent='00:00';
      if(btn){ btn.disabled=true; btn.classList.add('opacity-50'); btn.textContent='Account expired'; }
      const note=$('#fundExpiryNote'); if(note) note.textContent='This payment account has expired. Start a new funding request.';
      return;
    }
  };
  tick();
  State.fundingCountdownTimer=setInterval(tick,1000);
}

function copyFundingAccount(){
  const text=$('#fundAccountNumber')?.textContent?.trim()||'';
  if(!text) return;
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>toast('Account number copied','ok')).catch(()=>legacyCopyFunding(text));
  } else legacyCopyFunding(text);
}

function legacyCopyFunding(text){
  try{
    const ta=document.createElement('textarea');
    ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok=document.execCommand('copy'); ta.remove();
    toast(ok?'Account number copied':'Copy failed — tap and hold the account number to copy.',ok?'ok':'info');
  }catch(_){ toast('Copy failed — tap and hold the account number to copy.','info'); }
}

async function createTransferFunding(){
  const amt=Math.floor(Number($('#amt')?.value));
  const min=State.cfg.minFund||100;
  const fee=Math.max(0,Number(State.cfg.fundingFee)||0);
  if(!amt || amt<min) return toast('Minimum is '+peso(min),'err');
  if(amt<=fee) return toast('Amount must be higher than the funding charge of '+peso(fee),'err');
  if(!State.token || !State.user?.email) return toast('Please log in again.','err');

  const btn=$('#pay'); if(btn) btn.disabled=true;
  if(btn) btn.textContent='Creating secure payment account…';
  try{
    const r=await api('fundCreateTransfer',{amount:amt,__skipTxRefresh:true});
    if(r && r.ok){
      renderTransferAccount({
        reference:r.reference,
        amount:r.amount,
        bankName:r.bankName,
        accountNumber:r.accountNumber,
        accountName:r.accountName,
        expiresAt:r.expiresAt
      });
      return;
    }
    if(btn){btn.disabled=false;btn.textContent='Continue';}
    toast(r?.error||'Unable to create the payment account. Please try again.','err');
  }catch(_){
    if(btn){btn.disabled=false;btn.textContent='Continue';}
    toast('Network error. Please try again.','err');
  }
}

function markFundingReceived(r){
  stopFundingWatchers();
  clearPendingFunding(r?.reference||null);
  if(r?.balance!=null) State.user.wallet=r.balance;
  document.querySelectorAll('[data-wallet]').forEach(el=>{el.textContent=balText(State.user.wallet);});

  /*
   * Funding is complete as soon as fundVerify() returns ok.
   * The customer does NOT need to press "I've made the payment".
   * Provider/API response text is never shown in the customer-facing result.
   */
  refreshTxCache();
  purchaseResultScreen(true,'','Transaction successful! Thank you for your purchase.',true);
}

async function verifyTransferFunding(reference, silent=false){
  if(!reference || !State.token) return false;
  try{
    const r=await api('fundVerify',{reference,__skipTxRefresh:true});
    if(r && r.ok){ markFundingReceived(r); return true; }
    return false;
  }catch(_){ return false; }
}

async function confirmTransferFunding(){
  const pending=readPendingFunding();
  if(!pending) return false;
  const btn=$('#fundPaidBtn');
  if(btn){btn.disabled=true;btn.textContent='Checking payment…';}
  const ok=await verifyTransferFunding(pending.reference,false);
  if(!ok){
    if(btn){
      btn.disabled=false;
      btn.textContent="I've made the payment";
    }
    toast('Payment not confirmed yet. We will keep checking automatically.','info');
  }
  return ok;
}

function startFundingVerification(reference){
  if(State.fundingVerifyTimer) clearInterval(State.fundingVerifyTimer);
  let busy=false;
  const check=async()=>{
    if(busy || !State.token) return;
    const pending=readPendingFunding();
    if(!pending || String(pending.reference)!==String(reference)) return;
    const left=new Date(pending.expiresAt).getTime()-Date.now();
    if(left<=0){ clearInterval(State.fundingVerifyTimer); State.fundingVerifyTimer=null; return; }
    busy=true;
    try{ await verifyTransferFunding(reference,true); } finally { busy=false; }
  };
  check();
  State.fundingVerifyTimer=setInterval(check,5000);
}

function resumePendingTransferFunding(){
  const p=readPendingFunding();
  if(!p) return false;
  if(!p.expiresAt || new Date(p.expiresAt).getTime()<=Date.now()){ clearPendingFunding(p.reference); return false; }
  if(State.route==='fund') renderTransferAccount(p);
  return true;
}

window.addEventListener('online', ()=>{ if(State.token) resumePendingTransferFunding(); });
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && State.token) resumePendingTransferFunding(); });

function classifyDuration(label){
  const s = String(label||'').toLowerCase();
  if (/\bmonth(ly|s)?\b/.test(s)) return 'monthly';
  if (/\b(year|annual|yearly)\b/.test(s)) return 'monthly';
  if (/\b(30|31|45|60|90|120|180|360|365)\s*-?\s*day/.test(s)) return 'monthly';
  if (/\bweek(ly|s)?\b/.test(s)) return 'weekly';
  if (/\b(7|10|14|15|21)\s*-?\s*day/.test(s)) return 'weekly';
  if (/\bdaily\b/.test(s)) return 'daily';
  if (/\b(24|48|72)\s*-?\s*hour/.test(s)) return 'daily';
  if (/\b([1-6])\s*-?\s*day/.test(s)) return 'daily';
  return 'other';
}
function durationCounts(plans){
  const c = { all: plans.length, daily:0, weekly:0, monthly:0, other:0 };
  plans.forEach(p=>{ const d=classifyDuration(p.label); c[d] = (c[d]||0)+1; });
  return c;
}

async function refreshDataPlans(net, showError){
  const box=$('#plans');
  const r = await api('dataPlans',{network:net});
  if(!r.ok){
    /* Cached plans remain visible if a silent refresh fails. */
    if(showError && CURRENT_DATA_NET===net && !CURRENT_DATA_PLANS.length){
      box.innerHTML=`<div class="card rounded-2xl text-red-400 text-sm py-6 text-center">${esc(r.error||'Failed')}</div>`;
    }
    return;
  }
  const plans = r.plans || [];
  writeDataCache(net, plans);
  /* Do not let a slower response for an old network overwrite the user's
     currently selected network. */
  if(CURRENT_DATA_NET!==net) return;
  CURRENT_DATA_PLANS = plans;
  CURRENT_DATA_DURATION = 'all';
  renderDurationPills(durationCounts(CURRENT_DATA_PLANS));
  renderDataPlanList();
}
async function loadDataPlans(net){
  const box=$('#plans'); if(!box) return;
  CURRENT_DATA_NET = net;
  const cached=readDataCache(net);
  if(cached && Array.isArray(cached.plans)){
    /* Stale-while-revalidate: paint the cached plans immediately, then
       silently ask the backend for the newest catalogue in the background. */
    CURRENT_DATA_PLANS = cached.plans;
    CURRENT_DATA_DURATION = 'all';
    renderDurationPills(durationCounts(CURRENT_DATA_PLANS));
    renderDataPlanList();
    refreshDataPlans(net, false);
    return;
  }
  box.innerHTML=skeletonRows(4);
  await refreshDataPlans(net, true);
}

/* Attach HLS.js (or native HLS on Safari) to a <video> */
function attachHls_(video, src){
  if(!video) return;
  try{ if(window._hls){ window._hls.destroy(); window._hls=null; } }catch(e){}
  if(video.canPlayType('application/vnd.apple.mpegurl')){
    video.src = src; video.play().catch(()=>{}); return;
  }
  if(window.Hls && Hls.isSupported()){
    const hls = new Hls({ lowLatencyMode:true });
    window._hls = hls;
    hls.loadSource(src);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, ()=>{ video.play().catch(()=>{}); });
    hls.on(Hls.Events.ERROR, (evt,data)=>{ if(data && data.fatal){ toast('Stream unavailable right now','err'); } });
  } else {
    video.src = src; video.play().catch(()=>{});
  }
}

async function downloadReceipt(t){
  try{const blob=receiptPdfBlob_(t),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='receipt_'+(t.reference||t.id||'transaction')+'.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Receipt PDF downloaded.','ok');}
  catch(e){toast('Unable to create the receipt PDF right now. Please try again later.','err');}
}
async function shareReceipt(t,type='image'){
  try{
    let blob,filename,mime;if(type==='pdf'){blob=receiptPdfBlob_(t);filename='receipt_'+(t.reference||t.id||'transaction')+'.pdf';mime='application/pdf';}else{blob=await receiptImageBlob_(t);filename='receipt_'+(t.reference||t.id||'transaction')+'.png';mime='image/png';}
    const file=new File([blob],filename,{type:mime});
    if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){await navigator.share({title:'Transaction Receipt',text:'SIWTU transaction receipt',files:[file]});return;}
    if(type==='pdf') await downloadReceipt(t); else await downloadReceiptImage(t);
  }catch(e){if(e&&e.name==='AbortError')return;toast('Sharing is not available here. The receipt has not been sent.','info');}
}

    if(r.ok){ closeModal(); toast(r.message,'ok'); admRender(); } else toast(r.error,'err'); };
}

async function admKyc(body){
  const r=await api('adminKyc');
  if(!r.ok) return body.innerHTML=`<p class="text-red-400">${esc(r.error||'Failed to load KYC records')}</p>`;
  const list=r.kyc||[];
  body.innerHTML=`
    <div class="card rounded-2xl p-4 mb-4">
      <p class="font-bold">KYC Verification Review</p>
      <p class="text-xs text-slate-400 mt-1">Review the user's identity image and facial image, then approve or decline the request.</p>
    </div>
    <div class="space-y-3">${list.map(k=>`
      <div class="card rounded-2xl p-4">
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <p class="font-semibold text-sm">${esc(k.email)}</p>
            <p class="text-xs text-slate-400 mt-1">${esc(k.idType||'')}</p>
            <p class="text-xs text-slate-500 mt-1">ID: ${esc(k.idNumber||'')}</p>
          </div>
          <span class="text-[10px] uppercase px-2 py-1 rounded-full ${k.status==='approved'?'bg-brand-500/15 text-brand-300':k.status==='rejected'?'bg-red-500/15 text-red-300':'bg-amber-500/15 text-amber-300'}">${esc(k.status)}</span>
        </div>
        <p class="text-[10px] text-slate-500 mt-2">${esc(k.submittedAt||'')}</p>
        <div class="grid grid-cols-2 gap-2 mt-3">
          <button onclick="admViewKycImage('${esc(k.id)}','id')" class="glass rounded-lg py-2 text-xs font-semibold ${k.hasIdImage?'':'opacity-40'}" ${k.hasIdImage?'':'disabled'}>View ID image</button>
          <button onclick="admViewKycImage('${esc(k.id)}','face')" class="glass rounded-lg py-2 text-xs font-semibold ${k.hasFaceImage?'':'opacity-40'}" ${k.hasFaceImage?'':'disabled'}>View facial image</button>
        </div>
        ${k.status==='pending'?`<div class="grid grid-cols-2 gap-2 mt-3">
          <button onclick="admReviewKyc('${esc(k.email)}','approve')" class="bg-brand-600/20 text-brand-300 rounded-lg py-2.5 text-xs font-semibold">Approve</button>
          <button onclick="admReviewKyc('${esc(k.email)}','reject')" class="bg-red-600/20 text-red-300 rounded-lg py-2.5 text-xs font-semibold">Decline</button>
        </div>`:`<p class="text-xs mt-3 ${k.status==='approved'?'text-brand-400':'text-red-400'}">${k.status==='approved'?'Approved':'Declined'}${k.note?': '+esc(k.note):''}</p>`}
      </div>`).join('')||'<p class="text-slate-500 text-center py-10 text-sm">No KYC submissions yet.</p>'}
    </div>`;
}
async function admViewKycImage(id,kind){
  toast('Loading image…','info');
  const r=await api('adminKycImage',{id,kind});
  if(!r.ok) return toast(r.error||'Could not load image','err');
  const label=kind==='face'?'Facial image':'Means of identity image';
  modal(`<h3 class="font-display font-bold text-lg mb-3">${label}</h3><img src="${r.dataUrl}" alt="${label}" class="w-full max-h-[70vh] object-contain rounded-xl bg-black"/><button onclick="closeModal()" class="w-full glass rounded-xl py-3 font-bold mt-4">Close</button>`);
}
async function admReviewKyc(email,action){
  const approving=action==='approve';
  let note='';
  if(!approving){ note=prompt('Optional reason for declining this KYC:')||''; }
  if(!confirm((approving?'Approve':'Decline')+' KYC for '+email+'?')) return;
  const r=await api(approving?'adminApproveKyc':'adminRejectKyc',{email,note});
  if(r.ok){ toast(r.message||'KYC updated','ok'); admRender(); }
  else toast(r.error||'Failed to update KYC','err');
}

async function admAirCash(body){
  const r=await api('adminCashWithdrawals'); if(!r.ok) return body.innerHTML=`<p class="text-red-400">${esc(r.error)}</p>`;
  const s=await api('adminSettings'); const cfg=s.ok?s.settings:{};
  const pct=(k)=>Number(cfg[k]||0);
  body.innerHTML=`<div class="card rounded-2xl p-4"><p class="text-sm font-bold text-brand-300">Customer conversion rates</p><p class="text-[11px] text-slate-500 mt-1">Users only see these rates. The Bilal Sada Sub provider buyback rate is not returned to the customer.</p><div class="grid grid-cols-2 gap-2 mt-4">${[['MTN','CASH_MTN_PCT'],['Airtel','CASH_AIRTEL_PCT'],['GLO','CASH_GLO_PCT'],['9Mobile','CASH_9MOBILE_PCT']].map(x=>`<div class="glass rounded-xl p-3"><p class="text-xs text-slate-400">${x[0]}</p><input id="ac_${x[1]}" type="number" min="0" max="100" value="${pct(x[1])}" class="field mt-1"/><p class="text-[10px] text-slate-500 mt-1">Customer receives this %</p></div>`).join('')}</div><button onclick="saveCashRates()" class="w-full btn-primary rounded-xl py-3 font-bold mt-4">Save conversion rates</button></div><div class="flex items-center justify-between mt-7 mb-3"><h3 class="font-display font-bold">Withdrawal requests <span class="text-amber-400 text-xs">(${(r.withdrawals||[]).filter(w=>w.status==='pending').length} pending)</span></h3><button onclick="admRender()" class="text-xs text-brand-400">Refresh</button></div><div class="space-y-2">${(r.withdrawals||[]).map(w=>`<div class="card rounded-2xl p-4"><div class="flex justify-between gap-3"><div class="min-w-0"><p class="text-sm font-bold truncate">${esc(w.email)}</p><p class="text-sm text-brand-300 mt-1">${peso(w.amount)}</p><p class="text-xs text-slate-400 mt-1">${esc(w.bankName)} · ${esc(w.accountNumber)}</p><p class="text-xs text-slate-300 mt-1">${esc(w.accountName)}</p><p class="text-[10px] text-slate-500 mt-1">${esc(w.createdAt)}</p></div><span class="text-[10px] uppercase font-bold ${w.status==='paid'?'text-brand-400':w.status==='rejected'?'text-red-400':'text-amber-400'}">${esc(w.status)}</span></div>${w.status==='pending'?`<div class="grid grid-cols-2 gap-2 mt-3"><button onclick="admCashPaid('${esc(w.id)}')" class="btn-primary rounded-lg py-2 text-xs font-bold">Mark as Paid</button><button onclick="admCashReject('${esc(w.id)}')" class="bg-red-600/20 text-red-300 rounded-lg py-2 text-xs font-bold">Reject / Return</button></div>`:''}</div>`).join('')||`<p class="text-slate-500 text-sm text-center py-8">No withdrawal requests.</p>`}</div>`;
}
async function saveCashRates(){const settings={};['CASH_MTN_PCT','CASH_AIRTEL_PCT','CASH_GLO_PCT','CASH_9MOBILE_PCT'].forEach(k=>settings[k]=Math.max(0,Math.min(100,Number($('#ac_'+k).value)||0)));const r=await api('adminSaveSettings',{settings});if(r.ok){toast('Airtime-to-Cash rates saved','ok');const c=await api('config');if(c.ok)State.cfg=c.config;}else toast(r.error||'Could not save','err');}
async function admCashPaid(id){const ref=prompt('Optional payment reference:','');const r=await api('adminMarkCashPaid',{id,reference:ref||''});if(r.ok){toast(r.message,'ok');admRender();}else toast(r.error,'err');}
async function admCashReject(id){const note=prompt('Reason for rejection (optional):','');const r=await api('adminRejectCashWithdrawal',{id,note:note||''});if(r.ok){toast(r.message,'ok');admRender();}else toast(r.error,'err');}

async function admSettings(body){
  const r=await api('adminSettings'); if(!r.ok) return body.innerHTML=`<p class="text-red-400">${esc(r.error)}</p>`;
  const s=r.settings;
  const field=(k,label,type='text',hint='')=>`<div><label class="text-xs text-slate-400">${label}</label>
    <input id="set_${k}" type="${type}" value="${esc(s[k]||'')}" class="field mt-1" />${hint?`<p class="text-[10px] text-slate-500 mt-1">${hint}</p>`:''}</div>`;
  body.innerHTML=`<div class="space-y-4">
    <div class="card rounded-2xl p-4 flex items-center justify-between">
      <div><p class="text-sm font-bold text-brand-400">Block Ads (Videos & Live TV)</p><p class="text-[11px] text-slate-500">Ad-free, no-redirect playback for everyone.</p></div>
      <button onclick="admToggleAdBlock()" class="relative w-16 h-8 rounded-full transition ${adBlockOn_()?'bg-brand-500':'bg-slate-600'}">
        <span class="absolute top-1 ${adBlockOn_()?'right-1':'left-1'} w-6 h-6 rounded-full bg-white transition"></span>
      </button>
    </div>
    <div class="card rounded-2xl p-4 space-y-3">
      <p class="text-sm font-bold text-brand-400">API Keys</p>
      ${field('PEYFLEX_KEY','Peyflex API Token')}
      ${field('BILAL_KEY','Bilal Sada Sub API Key','password','Used for Data and Airtime. Leave unchanged to keep current.')}
      ${field('PAYSTACK_PUBLIC','Paystack Public Key')}
      ${field('PAYSTACK_SECRET','Paystack Secret Key','password','Stays server-side. Leave unchanged to keep current.')}
      ${field('ADMIN_PASSWORD','Command Centre Password','password')}
    </div>
    <div class="card rounded-2xl p-4 space-y-3">
      <p class="text-sm font-bold text-brand-400">Business</p>
      ${field('SITE_NAME','Website / Business Name')}
      ${field('WHATSAPP','Support WhatsApp (e.g. 2348012345678)')}
      ${field('MIN_FUND','Minimum funding (₦)','number')}
      ${field('FUNDING_FEE','Fixed funding charge (₦)','number','Deducted from every successful wallet funding. Example: pay ₦500, fee ₦50, wallet receives ₦450.')}
    </div>
    <div class="card rounded-2xl p-4 space-y-3">
      <p class="text-sm font-bold text-brand-400">Margins & Rewards</p>
      ${field('AIRTIME_DISCOUNT','Airtime discount to users (%)','number')}
      ${field('DATA_MARKUP','Data markup (%)','number')}
      ${field('CABLE_MARKUP','Cable markup (%)','number')}
      ${field('ELEC_FEE','Electricity flat fee (₦)','number')}
      ${field('REFERRAL_BONUS','Referral bonus (₦)','number')}
      ${field('CASH_MTN_PCT','Airtime-to-Cash MTN customer rate (%)','number','Only this customer-facing rate is used to calculate the wallet credit. Provider buyback rates are kept server-side.')}
      ${field('CASH_AIRTEL_PCT','Airtime-to-Cash Airtel customer rate (%)','number')}
      ${field('CASH_GLO_PCT','Airtime-to-Cash GLO customer rate (%)','number')}
      ${field('CASH_9MOBILE_PCT','Airtime-to-Cash 9Mobile customer rate (%)','number')}
    </div>
    <button id="save" class="w-full btn-primary rounded-xl py-3.5 font-bold">Save all settings</button>
  </div>`;
  $('#save').onclick=async(e)=>{
    btnLoad(e.target);
    const keys=['PEYFLEX_KEY','BILAL_KEY','PAYSTACK_PUBLIC','PAYSTACK_SECRET','ADMIN_PASSWORD','SITE_NAME','WHATSAPP','MIN_FUND','FUNDING_FEE','AIRTIME_DISCOUNT','DATA_MARKUP','CABLE_MARKUP','ELEC_FEE','REFERRAL_BONUS','CASH_MTN_PCT','CASH_AIRTEL_PCT','CASH_GLO_PCT','CASH_9MOBILE_PCT'];
    const settings={}; keys.forEach(k=>{ const v=$('#set_'+k).value; if(!((k==='PAYSTACK_SECRET'||k==='ADMIN_PASSWORD'||k==='BILAL_KEY')&&v==='')) settings[k]=v; });
    const r=await api('adminSaveSettings',{settings});
    btnLoad(e.target,false);
    if(r.ok){ toast('Settings saved','ok'); const c=await api('config'); if(c.ok) State.cfg=c.config; setupWhatsApp(); } else toast(r.error,'err');
  };
}
async function admTx(body){
  const r=await api('adminTx'); if(!r.ok) return body.innerHTML=`<p class="text-red-400">${esc(r.error)}</p>`;
  body.innerHTML=`<div class="space-y-2">${r.transactions.map(t=>{ const st=displayStatus_(t); const svc=friendlyService_(t); return `<div class="card rounded-2xl p-3.5">
    <div class="flex justify-between items-center">
      <div class="min-w-0"><p class="text-sm font-semibold truncate">${esc(svc)}</p><p class="text-[11px] text-slate-500 truncate">${esc(t.email)}</p></div>
      <div class="text-right shrink-0 ml-2"><p class="font-bold text-sm ${t.type==='credit'?'text-brand-400':''}">${peso(t.amount)}</p>
        <p class="text-[10px] capitalize ${st==='failed'?'text-red-400':st==='success'?'text-brand-400':'text-amber-400'}">${esc(st)}</p></div>
    </div>
    ${t.status==='failed'?`<button onclick="admRefund('${t.id}')" class="mt-2 w-full bg-brand-600/20 text-brand-300 rounded-lg py-1.5 text-xs font-semibold">Refund to wallet</button>`:''}
  </div>`; }).join('')||`<p class="text-slate-500 text-center py-8 text-sm">No transactions</p>`}</div>`;
}
async function admRefund(id){ const r=await api('adminRefund',{id}); if(r.ok){toast(r.message,'ok');admRender();} else toast(r.error,'err'); }

/* ===================================================================== */
boot();
</script>

<div id="siwtuGlobalInstallCard" role="region" aria-label="Install SIWTU app">

<script>
(function(){
 const card=document.getElementById('siwtuGlobalInstallCard'); if(!card)return;
 const standalone=()=>window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
 let dismissed=false; try{dismissed=sessionStorage.getItem('siwtu-pwa-prompt-dismissed')==='1'}catch(_){}
 function show(){if(!standalone()&&!dismissed&&!window.appInstalled)card.style.display='flex'}
 window.addEventListener('beforeinstallprompt',()=>show());
 window.addEventListener('appinstalled',()=>{card.style.display='none'});
 if(!standalone()&&!dismissed)setTimeout(show,1200);
})();
</script>
